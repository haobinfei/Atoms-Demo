# 一键全栈：docker compose up --build
# 复刻本地开发拓扑 —— web(nginx) 伺服 SPA 并反代 /api、/app、/pay 到 server。
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: atoms-demo-server:latest
    # 可选：.env 存在则加载；缺省数据库与邮件配置由下方本地服务提供。
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4173
      WORKSPACE_DIR: /workspace
      DATABASE_DSN: ${DATABASE_DSN:-postgres://atoms:local-dev-only@postgres:5432/atoms?sslmode=disable}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_BASE_URL: "http://localhost:${WEB_PORT:-8080}"
      COOKIE_SECURE: "0"
      # 默认忽略代理 IP 头；需要区分客户端时仅填写实际 Nginx/入口代理来源 CIDR。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atoms
      POSTGRES_USER: atoms
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/local/01-baseline.sql:/docker-entrypoint-initdb.d/01-baseline.sql:ro
      - ./internal/identity/schema.sql:/docker-entrypoint-initdb.d/02-identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoms -d atoms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: atoms-demo-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    # server 无内建 healthcheck（distroless 无 shell），depends_on 仅
    # 保证启动顺序：web 先就绪时 /api 会短暂 502，数秒后自愈。
    # 另：nginx 在启动时静态解析 service 名 server——server 容器
    # 重建换 IP 后需重启 web 才会重新解析（K8s 集群内 ClusterIP
    # 恒定，无此问题）。
    depends_on:
      - server
    restart: unless-stopped

volumes:
  workspace:
  postgres_data:
