# 使用 self-hosted runner 的 Docker daemon，避免下载 Docker Actions 超时。
# main 构建分支/sha 镜像，v* tag 构建版本镜像并回写 GitOps。
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: ss-vip

jobs:
  build:
    name: Build ${{ matrix.component }} Image
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        env:
          REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          IMAGE="$REGISTRY/$NAMESPACE/atoms-demo-$COMPONENT"
          SHA_TAG="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#v}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          # 关闭 provenance/sbom，避免 ACR 不支持的 attestation manifest。
          docker buildx build --provenance=false --sbom=false --push \
            --file "Dockerfile.$COMPONENT" \
            --tag "$IMAGE:$SHA_TAG" --tag "$IMAGE:$RELEASE_TAG" .

  bump-gitops:
    name: Bump Image Tags in atoms-demo-gitops
    runs-on: self-hosted
    needs: [build]
    if: github.ref_type == 'tag'
    steps:
      # runner 的 git/ssh 配置使用 GitOps 读写 deploy key。
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/atoms-demo-gitops
      - name: Bump image tags
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|g" charts/atoms-demo/values.yaml
      - name: Commit and push
        run: |
          git config user.name "atoms-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add charts/atoms-demo/values.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: image tag ${GITHUB_REF_NAME}"
          git push
