# 打 v* tag 发版：构建并推送 server/web 镜像到 ghcr.io，然后回写
# atoms-demo-gitops 的 values.yaml tag —— Argo CD 的 automated sync
# 检测到 gitops 仓库变更后自动拉起新版本（见 gitops 仓库 README）。
name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/atoms-demo-server:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/atoms-demo-server:${{ github.ref_name }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/atoms-demo-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/atoms-demo-web:${{ github.ref_name }}

  bump-gitops:
    needs: images
    runs-on: ubuntu-latest
    steps:
      # 需要 secret GITOPS_TOKEN：对 atoms-demo-gitops 有写权限的 PAT。
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/atoms-demo-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Bump image tags
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|g" charts/atoms-demo/values.yaml
          grep -A3 "  server:" charts/atoms-demo/values.yaml
      - name: Commit & push
        run: |
          git config user.name "atoms-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "release: image tag ${GITHUB_REF_NAME}"
          git push
