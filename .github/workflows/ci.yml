name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Dockerfile.server 构建在 golang:1.25-alpine 上，该镜像设 GOTOOLCHAIN=local
      # （拒绝自动下载更新的工具链）。而这里的 setup-go 默认 GOTOOLCHAIN=auto，
      # 会自动拉新版工具链——于是「go.mod 要求 go >= 1.26」能过 CI 却让镜像构建失败
      # （v0.6.0 就这么挂过）。用 local 语义复现镜像的约束，让它在这里就红。
      - name: Reject deps requiring a newer Go than the image
        run: GOTOOLCHAIN=local go mod download
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/package-lock.json') }}
      - name: Start E2E dependencies
        run: docker compose -f e2e/compose.yaml up -d --wait
      - run: npm ci
        working-directory: e2e
      # webServer 会在 ../web 里执行 `npm run build && npm run preview`，
      # e2e 目录的 npm ci 不会装 web 的依赖
      - run: npm ci
        working-directory: web
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      # 复用上一轮构建好的 SPA。dist 里没有环境相关的内容：vite.config.ts 的
      # ATOMS_API 只是运行时代理目标（process.env），不会内联进 bundle，所以
      # 缓存命中时 playwright.config 会跳过 npm run build。
      # key 覆盖全部构建输入，源码或依赖一变即失效。
      - name: Restore built SPA
        uses: actions/cache@v4
        with:
          path: web/dist
          key: web-dist-${{ hashFiles('web/src/**', 'web/index.html', 'web/package.json', 'web/package-lock.json', 'web/vite.config.ts', 'web/tsconfig.json') }}
      - run: npx playwright test
        working-directory: e2e
      - name: Stop E2E dependencies
        if: always()
        run: docker compose -f e2e/compose.yaml down -v
